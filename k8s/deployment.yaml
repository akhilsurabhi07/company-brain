apiVersion: v1
kind: Secret
metadata:
  name: company-brain-secrets
  namespace: company-brain
type: Opaque
stringData:
  POSTGRES_USER: "company_brain_app"
  POSTGRES_PASSWORD: "app_secure_password_2026"
  MASTER_ENCRYPTION_KEY: "prod_master_key_32bytes_length!!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-brain-api
  namespace: company-brain
  labels:
    app: company-brain-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: company-brain-api
  template:
    metadata:
      labels:
        app: company-brain-api
    spec:
      containers:
      - name: api
        image: company-brain-api:v1.0.0
        imagePullPolicy: IFNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: POSTGRES_HOST
          value: "postgres-service"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "company_brain"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        envFrom:
        - secretRef:
            name: company-brain-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: company-brain-api-service
  namespace: company-brain
spec:
  type: ClusterIP
  selector:
    app: company-brain-api
  ports:
  - port: 80
    targetPort: 8000
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: company-brain-api-hpa
  namespace: company-brain
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: company-brain-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
